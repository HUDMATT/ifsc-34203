<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Hudson Matthews" />
  <meta name="description" content="Native Audio and Video Examples" />
  <title>Native Audio and Video</title>
  <link rel="stylesheet" href="assets/css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />

  <meta name="theme-color" content="#1F5A3F" />
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DR155C6N32"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  gtag('config', 'G-DR155C6N32');

<body>
  <header>
    <h1>Native Audio and Video</h1>
  </header>
  <div class="vid-card">
    <h2>Video Example</h2>
    <video poster="assets/img/hudson-shelter-falls-poster.jpg" controls>
      <source src='assets/video/hudson-shelter-falls.mp4' type="video/mp4" />
      <source src='assets/video/hudson-shelter-falls.webm' type="video/webm" />
      <source src='assets/video/hudson-shelter-falls.ogv' type="video/ogg" />
    </video>
  </div>
  <div class="vid-card">
    <h2>Audio Example</h2>
    <audio controls>
      <source src='assets/audio/thunder.mp3' type="audio/mpeg" />
      <source src='assets/audio/thunder.ogg' type="audio/ogg" />
      <source src='assets/audio/thunder.wav' type="audio/wav" />
    </audio>
  </div>
  <footer>
    <div id="copyright">
      &copy; 2026 Hudson Matthews | <a href="#top">Top</a>
    </div>
  </footer>
</body>

</html>
